name: Scan market and publish

on:
  schedule:
    # Backup runs in case the ticker workflow fails to start; ticker.yml does the 15 minute cadence
    - cron: "0 15,18,21 * * 1-5"
    # Weekly keepalive so GitHub never pauses the schedules for inactivity
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        run: python scan.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Keepalive commit (Mondays only)
        if: github.event.schedule == '0 12 * * 1'
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add universe.csv
          date -u > .keepalive
          git add .keepalive
          git commit -m "Weekly keepalive and universe refresh" || echo "nothing to commit"
          git push
