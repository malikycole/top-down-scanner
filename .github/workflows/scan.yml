name: Scan market and publish

on:
  schedule:
    # Backup runs in case the ticker workflow fails to start; ticker.yml does the 15 minute cadence
    - cron: "0 15,18,21 * * 1-5"
    # Weekly keepalive so GitHub never pauses the schedules for inactivity
    - cron: "0 12 * * 1"
  workflow_dispatch:
  # Redeploy right away when the scanner code or page changes
  push:
    branches: [main]
    paths: ["scan.py", "true_momentum.py", "site/**", "requirements.txt"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Option open interest is fetched slowly (Cboe rate limit) and kept for the day,
      # so each run restores the latest cache and only looks up what is missing
      - uses: actions/cache@v4
        with:
          path: |
            options_cache.json
            tm_history.pkl
          key: options-${{ github.run_id }}
          restore-keys: options-

      - name: Run scan
        run: python scan.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Watchdog: GitHub sometimes skips every scheduled start of the ticker. If a scan finishes
      # during market hours and no ticker is running, start one so the 15 minute scans keep going.
      - name: Restart the ticker if it is not running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          now=$(date -u +%H%M); dow=$(date -u +%u)
          if [ "$dow" -le 5 ] && [ "$now" -ge 1300 ] && [ "$now" -lt 2100 ]; then
            running=$(gh run list --workflow ticker.yml --limit 5 --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
            if [ "$running" = "0" ]; then gh workflow run ticker.yml --ref main && echo "ticker restarted"; else echo "ticker already running"; fi
          fi

      - name: Keepalive commit (Mondays only)
        if: github.event.schedule == '0 12 * * 1'
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add universe.csv
          date -u > .keepalive
          git add .keepalive
          git commit -m "Weekly keepalive and universe refresh" || echo "nothing to commit"
          git push
