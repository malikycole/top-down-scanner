name: Market hours ticker

# GitHub drops many scheduled runs, so the scan workflow cannot rely on its own
# Market hours ticker. This job starts once (several start times, in case some are
# skipped), stays alive through the session and asks for a scan every minute.
# GitHub keeps at most one scan waiting behind the running one, so the next scan starts the moment one finishes.
# scan.yml also restarts this ticker when a scan finishes in market hours and it is not running.
on:
  schedule:
    - cron: "25 13 * * 1-5"
    - cron: "45 13 * * 1-5"
    - cron: "15 14 * * 1-5"
    - cron: "15 15 * * 1-5"
    - cron: "15 17 * * 1-5"
    - cron: "15 19 * * 1-5"
  workflow_dispatch:
  # Start the ticker as soon as this file changes
  push:
    branches: [main]
    paths: [".github/workflows/ticker.yml"]

permissions:
  actions: write

concurrency:
  group: ticker
  cancel-in-progress: true     # a newer ticker (new settings) replaces the running one

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Keep a scan queued every minute until after the close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          start=$(date +%s)
          # 21:10 UTC covers the 4 PM ET close in both daylight and standard time
          stop=$(date -u -d "21:10" +%s)
          while [ "$(date +%s)" -lt "$stop" ] && [ $(( $(date +%s) - start )) -lt 20700 ]; do
            echo "$(date -u +%H:%M) starting scan"
            gh workflow run scan.yml --ref main || echo "dispatch failed, will retry next tick"
            sleep 60
          done
          echo "session over"
